name: Comprobar
on: [push, pull_request]
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm test
      - run: for f in scripts/*.mjs; do node --check "$f"; done
